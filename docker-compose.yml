services:
  db:
    image: postgres:15
    container_name: skillshikshyacrm_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: skillshikshyacrm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: skillshikshyacrm_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8188"
    volumes:
      - .:/app
    ports:
      - "8188:8188"
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CELERY_BROKER_URL: redis://redis:6379/0
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      PUBLIC_DEVELOPMENT_URL: ${PUBLIC_DEVELOPMENT_URL}
      ORBITCHAT_API_URL: ${ORBITCHAT_API_URL}
      ORBITCHAT_EMAIL: ${ORBITCHAT_EMAIL}
      ORBITCHAT_PASSWORD: ${ORBITCHAT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: skillshikshyacrm_celery
    restart: unless-stopped
    command: celery -A skillshikshyacrm worker -l info
    volumes:
      - .:/app
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CELERY_BROKER_URL: redis://redis:6379/0
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      PUBLIC_DEVELOPMENT_URL: ${PUBLIC_DEVELOPMENT_URL}
      ORBITCHAT_API_URL: ${ORBITCHAT_API_URL}
      ORBITCHAT_EMAIL: ${ORBITCHAT_EMAIL}
      ORBITCHAT_PASSWORD: ${ORBITCHAT_PASSWORD}
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: skillshikshyacrm_celery_beat
    restart: unless-stopped
    command: celery -A skillshikshyacrm beat -l info
    volumes:
      - .:/app
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CELERY_BROKER_URL: redis://redis:6379/0
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      PUBLIC_DEVELOPMENT_URL: ${PUBLIC_DEVELOPMENT_URL}
      ORBITCHAT_API_URL: ${ORBITCHAT_API_URL}
      ORBITCHAT_EMAIL: ${ORBITCHAT_EMAIL}
      ORBITCHAT_PASSWORD: ${ORBITCHAT_PASSWORD}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
