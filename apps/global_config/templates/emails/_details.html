<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%; margin:18px 0; border:1px solid #e3e6e4; border-radius:8px; border-collapse:separate; border-spacing:0;">
{% for label, value in rows %}{% if value or value == 0 %}
  <tr>
    <td style="padding:10px 14px; width:42%; font-size:13px; color:#5f6b66; {% if not forloop.first %}border-top:1px solid #eef0ef;{% endif %}">{{ label }}</td>
    <td style="padding:10px 14px; font-size:13px; font-weight:bold; color:#1c2421; text-align:right; {% if not forloop.first %}border-top:1px solid #eef0ef;{% endif %}">{{ value }}</td>
  </tr>
{% endif %}{% endfor %}
</table>
